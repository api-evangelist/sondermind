aid: sondermind
name: Sondermind
description: >-
  SonderMind is a Denver-based mental health company operating a measurement-based
  behavioral healthcare platform that connects people to licensed therapists and
  psychiatrists who have availability, accept insurance, and specialize in their
  needs. It offers virtual and in-person therapy and psychiatry across all 50 U.S.
  states, along with enterprise offerings for health systems, physician practices,
  payers, and Veterans. SonderMind is a General Catalyst portfolio company. As of
  this profile it publishes a consumer and clinician web platform (with a
  member/provider sign-in at api.sondermind.com) but no public developer API,
  developer portal, SDKs, or API documentation; this repository tracks SonderMind's
  public web, content, and identity surface for the API Evangelist network.
